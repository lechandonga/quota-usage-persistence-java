server.port=8080

# 本地嵌入式 H2 数据库（文件模式，数据保存在 ./data/quota-db）
spring.datasource.url=jdbc:h2:file:./data/quota-db;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway 结构演进：从空库自动建表并保留可追溯的变更记录
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# H2 控制台（本地调试用，访问 /h2-console）
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 用量游标签名密钥（生产环境应通过环境变量覆盖）
quota.cursor.secret=local-dev-cursor-secret-change-me

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
