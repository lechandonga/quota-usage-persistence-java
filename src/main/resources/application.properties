server.port=8080

# 本地嵌入式数据库（H2 文件模式），无需任何外部服务。
spring.datasource.url=jdbc:h2:file:./data/quota-db;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 空库启动时 Flyway 按 db/migration 下的版本脚本顺序建表并记录到 flyway_schema_history。
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.jackson.serialization.write-dates-as-timestamps=true

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
