# 测试环境：纯内存 H2，不依赖任何外部数据库服务，也不落本地文件
spring.datasource.url=jdbc:h2:mem:quota-test;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

quota.cursor.secret=test-cursor-secret

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.level.com.github.lechandonga=INFO
