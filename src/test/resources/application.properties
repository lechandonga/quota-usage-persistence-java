# 测试使用 H2 内存库，每个上下文全新空库，不依赖任何外部服务。
spring.datasource.url=jdbc:h2:mem:quota-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.test.console.output=always
logging.level.com.github.lechandonga=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
